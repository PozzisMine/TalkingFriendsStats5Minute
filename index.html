<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика каналов</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{flex:1;padding:10px;background:#1e293b;text-align:center;border-radius:10px;cursor:pointer}
.active{background:#2563eb}
.card{background:#1e293b;padding:15px;border-radius:15px;margin-bottom:15px}
select,button{width:100%;padding:10px;margin-bottom:10px;background:#020617;color:white;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155}
.up{color:#22c55e}
.down{color:#ef4444}
.same{color:#94a3b8}
</style>
</head>

<body>

<h2>Аналитика</h2>

<div class="tabs">
<div class="tab active" onclick="switchTab('overview',this)">Общий</div>
<div class="tab" onclick="switchTab('channels',this)">Каналы</div>
<div class="tab" onclick="switchTab('changed',this)">Изменения</div>
</div>

<div id="overview">

<div class="card">
<select id="daySelect"></select>

<select id="timeMode">
<option value="utc">UTC</option>
<option value="local">Моё время</option>
</select>

<button onclick="resetZoomAll()">Сброс графика</button>
</div>

<div class="card">
<h3>Таблица изменений</h3>

<table>
<thead>
<tr>
<th>Период</th>
<th>Подписчики</th>
<th>Просмотры</th>
<th>Видео</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="card"><canvas id="subsChart"></canvas></div>

</div>

<div id="channels" style="display:none">

<div class="card">
<select id="sortChannels">
<option value="subs_desc">Подписчики ↓</option>
<option value="subs_asc">Подписчики ↑</option>
<option value="views_desc">Просмотры ↓</option>
<option value="views_asc">Просмотры ↑</option>
<option value="videos_desc">Видео ↓</option>
<option value="videos_asc">Видео ↑</option>
<option value="name_asc">А → Я</option>
<option value="name_desc">Я → А</option>
</select>

<select id="channelSelect"></select>
</div>

<div class="card"><canvas id="channelChart"></canvas></div>

</div>

<div id="changed" style="display:none">

<div class="card">
<h3>Кто изменился</h3>

<table>
<thead>
<tr>
<th>Канал</th>
<th>Подписчики</th>
<th>Просмотры</th>
<th>Видео</th>
</tr>
</thead>

<tbody id="changedChannels"></tbody>
</table>

</div>

</div>

<script>
const API="https://talkingfriendsru.qpqalzmnx96.workers.dev/";

let history=[],timeMode="utc",subsChart,channelChart;

function format(n){return Number(n||0).toLocaleString("ru-RU")}

function diff(now,old){
const d=now-old;
if(d>0)return `<span class="up">▲ +${format(d)}</span>`;
if(d<0)return `<span class="down">▼ ${format(d)}</span>`;
return `<span class="same">— 0</span>`;
}

function time(t){
const d=new Date(t);
if(timeMode==="utc")return d.toLocaleTimeString("ru-RU",{timeZone:"UTC"})+" UTC";
return d.toLocaleTimeString("ru-RU");
}

function switchTab(id,el){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

["overview","channels","changed"].forEach(i=>{
document.getElementById(i).style.display=(i===id?"block":"none");
});
}

async function load(){
const res=await fetch(API+"/history.json?"+Date.now());
history=await res.json();

fillDays();
fillChannels();
render();
renderChanged();
}

function fillDays(){
const s=document.getElementById("daySelect");
const days=[...new Set(history.map(i=>i.updated_at.slice(0,10)))].reverse();
s.innerHTML="";
days.forEach(d=>{
const o=document.createElement("option");
o.value=d;o.textContent=d+" UTC";
s.appendChild(o);
});
}

function fillChannels(){
const last=history.at(-1);
let ch=[...last.channels];

const sort=document.getElementById("sortChannels").value;

ch.sort((a,b)=>{
if(sort==="subs_desc")return b.subscribers-a.subscribers;
if(sort==="subs_asc")return a.subscribers-b.subscribers;
if(sort==="views_desc")return b.views-a.views;
if(sort==="views_asc")return a.views-b.views;
if(sort==="videos_desc")return b.videos-a.videos;
if(sort==="videos_asc")return a.videos-b.videos;
if(sort==="name_asc")return a.title.localeCompare(b.title);
if(sort==="name_desc")return b.title.localeCompare(a.title);
});

const s=document.getElementById("channelSelect");
s.innerHTML="";
ch.forEach(c=>{
const o=document.createElement("option");
o.value=c.id;o.textContent=c.title;
s.appendChild(o);
});
}

function render(){
renderTable();
renderChart();
renderChannel();
}

function renderTable(){
const body=document.getElementById("tableBody");
body.innerHTML="";

const last=history.at(-1);
const prev=history.at(-2);

addRow("За минуту",prev,last);

const today=last.updated_at.slice(0,10);
const t=history.filter(i=>i.updated_at.startsWith(today));
if(t.length>1)addRow("Сегодня",t[0],t.at(-1));

const y=getPrevDay(today);
const yData=history.filter(i=>i.updated_at.startsWith(y));
if(yData.length>1)addRow("Вчера",yData[0],yData.at(-1));
}

function addRow(name,a,b){
const tr=document.createElement("tr");
tr.innerHTML=`
<td>${name}</td>
<td>${diff(b.total_subscribers,a.total_subscribers)}</td>
<td>${diff(b.total_views,a.total_views)}</td>
<td>${diff(b.total_videos,a.total_videos)}</td>`;
document.getElementById("tableBody").appendChild(tr);
}

function renderChanged(){
const tbody=document.getElementById("changedChannels");
tbody.innerHTML="";

const last=history.at(-1);
const prev=history.at(-2);

last.channels.forEach(n=>{
const o=prev.channels.find(c=>c.id===n.id);
if(!o)return;

const s=n.subscribers-o.subscribers;
const v=n.views-o.views;
const vid=n.videos-o.videos;

if(s===0&&v===0&&vid===0)return;

const tr=document.createElement("tr");
tr.innerHTML=`
<td>${n.title}</td>
<td>${diff(n.subscribers,o.subscribers)}</td>
<td>${diff(n.views,o.views)}</td>
<td>${diff(n.videos,o.videos)}</td>`;
tbody.appendChild(tr);
});
}

function renderChart(){
const day=document.getElementById("daySelect").value;
const d=history.filter(i=>i.updated_at.startsWith(day));

const labels=d.map(i=>time(i.updated_at));
const data=d.map(i=>i.total_subscribers);

if(subsChart)subsChart.destroy();

subsChart=new Chart(document.getElementById("subsChart"),{
type:"line",
data:{labels,datasets:[{data,borderColor:"#60a5fa"}]},
options:{
plugins:{
zoom:{
pan:{enabled:true,mode:"x"},
zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:"x"}
}
}
}
});
}

function renderChannel(){
const id=document.getElementById("channelSelect").value;
if(!id)return;

const labels=history.map(i=>time(i.updated_at));
const data=history.map(i=>{
const c=i.channels.find(x=>x.id===id);
return c?c.subscribers:null;
});

if(channelChart)channelChart.destroy();

channelChart=new Chart(document.getElementById("channelChart"),{
type:"line",
data:{labels,datasets:[{data,borderColor:"#22c55e"}]}
});
}

function getPrevDay(d){
const date=new Date(d);
date.setDate(date.getDate()-1);
return date.toISOString().slice(0,10);
}

function resetZoomAll(){
if(subsChart)subsChart.resetZoom();
if(channelChart)channelChart.resetZoom();
}

document.getElementById("daySelect").addEventListener("change",render);
document.getElementById("timeMode").addEventListener("change",e=>{timeMode=e.target.value;render();});
document.getElementById("channelSelect").addEventListener("change",renderChannel);
document.getElementById("sortChannels").addEventListener("change",()=>{fillChannels();renderChannel();});

load();
setInterval(load,60000);
</script>

</body>
</html>
