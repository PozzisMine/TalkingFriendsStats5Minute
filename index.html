<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика каналов</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  background: #020617;
  color: white;
  border: 1px solid #334155;
}

canvas {
  margin-top: 15px;
}
</style>
</head>

<body>

<h2>📊 Аналитика каналов</h2>

<div class="card">
  <div id="status">Загрузка...</div>
</div>

<div class="card">
  <select id="daySelect"></select>
</div>

<div class="card">
  <canvas id="subsChart"></canvas>
</div>

<div class="card">
  <canvas id="viewsChart"></canvas>
</div>

<div class="card">
  <canvas id="videosChart"></canvas>
</div>

<script>
const API = "https://talkingfriendsru.qpqalzmnx96.workers.dev";

let history = [];
let subsChart, viewsChart, videosChart;

async function load() {
  try {
    const res = await fetch(API + "/history.json?time=" + Date.now());
    history = await res.json();

    fillDays();
    render();

    document.getElementById("status").textContent =
      "Записей: " + history.length;

  } catch (e) {
    document.getElementById("status").textContent = "Ошибка: " + e.message;
  }
}

function fillDays() {
  const select = document.getElementById("daySelect");

  const days = [...new Set(
    history.map(i => i.updated_at.slice(0, 10))
  )];

  select.innerHTML = "";

  days.reverse().forEach(day => {
    const opt = document.createElement("option");
    opt.value = day;
    opt.textContent = day;
    select.appendChild(opt);
  });
}

function getDayData() {
  const selected = document.getElementById("daySelect").value;

  return history.filter(i =>
    i.updated_at.startsWith(selected)
  );
}

function render() {
  const data = getDayData();

  const labels = data.map(i =>
    new Date(i.updated_at).toLocaleTimeString("ru-RU")
  );

  const subs = data.map(i => i.total_subscribers);
  const views = data.map(i => i.total_views);
  const videos = data.map(i => i.total_videos);

  drawChart("subsChart", subsChart, labels, subs, "Подписчики", c => subsChart = c);
  drawChart("viewsChart", viewsChart, labels, views, "Просмотры", c => viewsChart = c);
  drawChart("videosChart", videosChart, labels, videos, "Видео", c => videosChart = c);
}

function drawChart(id, chart, labels, data, label, setChart) {
  if (chart) chart.destroy();

  const ctx = document.getElementById(id);

  const newChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label,
        data,
        borderColor: "#60a5fa",
        fill: false
      }]
    }
  });

  setChart(newChart);
}

document.getElementById("daySelect").addEventListener("change", render);

load();
setInterval(load, 60000);
</script>

</body>
</html>
