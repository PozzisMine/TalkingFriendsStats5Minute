<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>YouTube статистика</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 { text-align: center; }

.select-box {
  text-align: center;
  margin-bottom: 15px;
}

select {
  padding: 10px;
  border-radius: 10px;
  background: #1e293b;
  color: white;
  border: none;
}

.chart-box {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
  height: 400px;
}
</style>
</head>

<body>

<h1>YouTube статистика</h1>

<div class="select-box">
  <select id="channelSelect"></select>
</div>

<div class="chart-box">
  <canvas id="chart"></canvas>
</div>

<script>
let historyData = [];
let chart;
let selectedChannel = "all";

async function load() {
  const res = await fetch("history.json?time=" + Date.now());
  historyData = await res.json();

  fillSelect();
  drawChart();
}

function fillSelect() {
  const select = document.getElementById("channelSelect");
  select.innerHTML = "";

  const allOption = document.createElement("option");
  allOption.value = "all";
  allOption.textContent = "Все каналы";
  select.appendChild(allOption);

  const first = historyData[0];
  if (!first) return;

  first.channels.forEach(ch => {
    const opt = document.createElement("option");
    opt.value = ch.id;
    opt.textContent = ch.title;
    select.appendChild(opt);
  });

  select.onchange = () => {
    selectedChannel = select.value;
    drawChart();
  };
}

function drawChart() {
  if (chart) chart.destroy();

  const labels = historyData.map(x =>
    new Date(x.updated_at).toLocaleString("ru-RU")
  );

  let values = [];

  if (selectedChannel === "all") {
    values = historyData.map(x => x.total_subscribers);
  } else {
    values = historyData.map(x => {
      const ch = x.channels.find(c => c.id === selectedChannel);
      return ch ? ch.subscribers : null;
    });
  }

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: selectedChannel === "all" ? "Все каналы" : "Канал",
        data: values,
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        zoom: {
          pan: { enabled: true, mode: "x" },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: "x"
          }
        }
      }
    }
  });
}

load();
</script>

</body>
</html>
