<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика каналов</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{flex:1;padding:10px;background:#1e293b;text-align:center;border-radius:10px;cursor:pointer}
.active{background:#2563eb}
.card{background:#1e293b;padding:15px;border-radius:15px;margin-bottom:15px}
select,button{width:100%;padding:10px;margin-bottom:10px;background:#020617;color:white;border-radius:10px;border:1px solid #334155}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155}
.up{color:#22c55e}
.down{color:#ef4444}
.same{color:#94a3b8}
.error{color:#f87171}
</style>
</head>

<body>

<h2>Аналитика</h2>

<div class="tabs">
  <div class="tab active" onclick="switchTab('overview',this)">Общий</div>
  <div class="tab" onclick="switchTab('channels',this)">Каналы</div>
  <div class="tab" onclick="switchTab('changed',this)">Изменения</div>
</div>

<div class="card" id="status">Загрузка...</div>

<div id="overview">
  <div class="card">
    <select id="daySelect"></select>

    <select id="timeMode">
      <option value="utc">UTC</option>
      <option value="local">Моё время</option>
    </select>

    <button onclick="resetZoomAll()">Сбросить масштаб</button>
  </div>

  <div class="card">
    <h3>Таблица изменений</h3>

    <select id="tableMode">
      <option value="minute">За минуту</option>
      <option value="day">За день</option>
    </select>

    <table>
      <thead>
        <tr>
          <th>Время / период</th>
          <th>Подписчики</th>
          <th>Просмотры</th>
          <th>Видео</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Подписчики</h3>
    <canvas id="subsChart"></canvas>
  </div>

  <div class="card">
    <h3>Просмотры</h3>
    <canvas id="viewsChart"></canvas>
  </div>

  <div class="card">
    <h3>Видео</h3>
    <canvas id="videosChart"></canvas>
  </div>
</div>

<div id="channels" style="display:none">
  <div class="card">
    <select id="sortChannels">
      <option value="subs_desc">Подписчики ↓</option>
      <option value="subs_asc">Подписчики ↑</option>
      <option value="views_desc">Просмотры ↓</option>
      <option value="views_asc">Просмотры ↑</option>
      <option value="videos_desc">Видео ↓</option>
      <option value="videos_asc">Видео ↑</option>
      <option value="name_asc">А → Я</option>
      <option value="name_desc">Я → А</option>
    </select>

    <select id="channelSelect"></select>

    <button onclick="resetZoomAll()">Сбросить масштаб</button>
  </div>

  <div class="card">
    <h3>Подписчики канала</h3>
    <canvas id="channelSubsChart"></canvas>
  </div>

  <div class="card">
    <h3>Просмотры канала</h3>
    <canvas id="channelViewsChart"></canvas>
  </div>

  <div class="card">
    <h3>Видео канала</h3>
    <canvas id="channelVideosChart"></canvas>
  </div>
</div>

<div id="changed" style="display:none">
  <div class="card">
    <h3>Кто изменился за последнюю минуту</h3>

    <table>
      <thead>
        <tr>
          <th>Канал</th>
          <th>Подписчики</th>
          <th>Просмотры</th>
          <th>Видео</th>
        </tr>
      </thead>
      <tbody id="changedChannels"></tbody>
    </table>
  </div>
</div>

<script>
const API = "https://talkingfriendsru.qpqalzmnx96.workers.dev";

let history = [];
let timeMode = "utc";

let subsChart;
let viewsChart;
let videosChart;
let channelSubsChart;
let channelViewsChart;
let channelVideosChart;

function format(n){
  return Number(n || 0).toLocaleString("ru-RU");
}

function diff(now, old){
  const d = Number(now || 0) - Number(old || 0);

  if(d > 0) return `<span class="up">▲ +${format(d)}</span>`;
  if(d < 0) return `<span class="down">▼ ${format(d)}</span>`;
  return `<span class="same">— 0</span>`;
}

function time(t){
  const d = new Date(t);

  if(timeMode === "utc"){
    return d.toLocaleTimeString("ru-RU", {
      timeZone: "UTC",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    }) + " UTC";
  }

  return d.toLocaleTimeString("ru-RU", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

function switchTab(id, el){
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  ["overview","channels","changed"].forEach(tab => {
    document.getElementById(tab).style.display = tab === id ? "block" : "none";
  });
}

async function load(){
  try {
    const res = await fetch(API + "/history.json?time=" + Date.now());
    history = await res.json();

    if(!Array.isArray(history) || history.length < 1){
      throw new Error("history.json пустой");
    }

    fillDays();
    fillChannels();
    renderAll();

    document.getElementById("status").textContent =
      "Записей в истории: " + format(history.length);

  } catch(e) {
    document.getElementById("status").innerHTML =
      `<span class="error">Ошибка: ${e.message}</span>`;
  }
}

function fillDays(){
  const select = document.getElementById("daySelect");
  const old = select.value;

  const days = [...new Set(history.map(i => i.updated_at.slice(0,10)))].reverse();

  select.innerHTML = "";

  days.forEach(day => {
    const opt = document.createElement("option");
    opt.value = day;
    opt.textContent = day + " UTC";
    select.appendChild(opt);
  });

  select.value = days.includes(old) ? old : days[0];
}

function fillChannels(){
  const select = document.getElementById("channelSelect");
  const old = select.value;
  const sort = document.getElementById("sortChannels").value;

  const last = history[history.length - 1];
  let channels = [...last.channels];

  channels.sort((a,b) => {
    if(sort === "subs_desc") return b.subscribers - a.subscribers;
    if(sort === "subs_asc") return a.subscribers - b.subscribers;
    if(sort === "views_desc") return b.views - a.views;
    if(sort === "views_asc") return a.views - b.views;
    if(sort === "videos_desc") return b.videos - a.videos;
    if(sort === "videos_asc") return a.videos - b.videos;
    if(sort === "name_asc") return a.title.localeCompare(b.title);
    if(sort === "name_desc") return b.title.localeCompare(a.title);
    return 0;
  });

  select.innerHTML = "";

  channels.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.title;
    select.appendChild(opt);
  });

  const exists = [...select.options].some(o => o.value === old);
  select.value = exists ? old : channels[0]?.id;
}

function getDayData(){
  const day = document.getElementById("daySelect").value;
  return history.filter(i => i.updated_at.startsWith(day));
}

function renderAll(){
  renderTable();
  renderOverviewCharts();
  renderChannelCharts();
  renderChanged();
}

function renderTable(){
  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  const mode = document.getElementById("tableMode").value;
  const dayData = getDayData();

  if(dayData.length < 2){
    body.innerHTML = `<tr><td colspan="4">Недостаточно данных</td></tr>`;
    return;
  }

  if(mode === "minute"){
    for(let i = 1; i < dayData.length; i++){
      const prev = dayData[i - 1];
      const now = dayData[i];

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${time(now.updated_at)}</td>
        <td>${diff(now.total_subscribers, prev.total_subscribers)}</td>
        <td>${diff(now.total_views, prev.total_views)}</td>
        <td>${diff(now.total_videos, prev.total_videos)}</td>
      `;

      body.prepend(tr);
    }

    return;
  }

  if(mode === "day"){
    addRow("Итого за день", dayData[0], dayData[dayData.length - 1]);
  }
}

function addRow(name, a, b){
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td>${name}</td>
    <td>${diff(b.total_subscribers, a.total_subscribers)}</td>
    <td>${diff(b.total_views, a.total_views)}</td>
    <td>${diff(b.total_videos, a.total_videos)}</td>
  `;

  document.getElementById("tableBody").appendChild(tr);
}

function renderOverviewCharts(){
  const data = getDayData();

  const labels = data.map(i => time(i.updated_at));

  subsChart = drawChart(
    "subsChart",
    subsChart,
    labels,
    data.map(i => i.total_subscribers),
    "Подписчики"
  );

  viewsChart = drawChart(
    "viewsChart",
    viewsChart,
    labels,
    data.map(i => i.total_views),
    "Просмотры"
  );

  videosChart = drawChart(
    "videosChart",
    videosChart,
    labels,
    data.map(i => i.total_videos),
    "Видео"
  );
}

function getChannel(item, id){
  return item.channels.find(c => c.id === id);
}

function renderChannelCharts(){
  const id = document.getElementById("channelSelect").value;
  if(!id) return;

  const data = getDayData();
  const labels = data.map(i => time(i.updated_at));

  const channelData = data.map(i => getChannel(i, id) || {});

  channelSubsChart = drawChart(
    "channelSubsChart",
    channelSubsChart,
    labels,
    channelData.map(c => c.subscribers ?? null),
    "Подписчики канала"
  );

  channelViewsChart = drawChart(
    "channelViewsChart",
    channelViewsChart,
    labels,
    channelData.map(c => c.views ?? null),
    "Просмотры канала"
  );

  channelVideosChart = drawChart(
    "channelVideosChart",
    channelVideosChart,
    labels,
    channelData.map(c => c.videos ?? null),
    "Видео канала"
  );
}

function renderChanged(){
  const tbody = document.getElementById("changedChannels");
  tbody.innerHTML = "";

  if(history.length < 2){
    tbody.innerHTML = `<tr><td colspan="4">Недостаточно данных</td></tr>`;
    return;
  }

  const last = history[history.length - 1];
  const prev = history[history.length - 2];

  let count = 0;

  last.channels.forEach(now => {
    const old = prev.channels.find(c => c.id === now.id);
    if(!old) return;

    const s = now.subscribers - old.subscribers;
    const v = now.views - old.views;
    const vid = now.videos - old.videos;

    if(s === 0 && v === 0 && vid === 0) return;

    count++;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${now.title}</td>
      <td>${diff(now.subscribers, old.subscribers)}</td>
      <td>${diff(now.views, old.views)}</td>
      <td>${diff(now.videos, old.videos)}</td>
    `;
    tbody.appendChild(tr);
  });

  if(count === 0){
    tbody.innerHTML = `<tr><td colspan="4">Изменений нет</td></tr>`;
  }
}

function drawChart(id, oldChart, labels, data, label){
  if(oldChart) oldChart.destroy();

  return new Chart(document.getElementById(id), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label,
        data,
        borderColor: "#60a5fa",
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      interaction: {
        mode: "index",
        intersect: false
      },
      plugins: {
        zoom: {
          pan: { enabled: true, mode: "x" },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: "x"
          }
        }
      }
    }
  });
}

function resetZoomAll(){
  if(subsChart) subsChart.resetZoom();
  if(viewsChart) viewsChart.resetZoom();
  if(videosChart) videosChart.resetZoom();

  if(channelSubsChart) channelSubsChart.resetZoom();
  if(channelViewsChart) channelViewsChart.resetZoom();
  if(channelVideosChart) channelVideosChart.resetZoom();
}

document.getElementById("daySelect").addEventListener("change", renderAll);

document.getElementById("tableMode").addEventListener("change", renderTable);

document.getElementById("timeMode").addEventListener("change", e => {
  timeMode = e.target.value;
  renderAll();
});

document.getElementById("channelSelect").addEventListener("change", renderChannelCharts);

document.getElementById("sortChannels").addEventListener("change", () => {
  fillChannels();
  renderChannelCharts();
});

load();
setInterval(load, 60000);
</script>

</body>
</html>
