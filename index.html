<script>
const API_BASE = "https://talkingfriendsru.qpqazlmnx96.workers.dev";

let chart;

function format(n){
  return Number(n || 0).toLocaleString("ru-RU");
}

async function load(){
  try {
    const statsRes = await fetch(API_BASE + "/stats.json");
    const historyRes = await fetch(API_BASE + "/history.json");

    const stats = await statsRes.json();
    const history = await historyRes.json();

    if (!stats || !stats.updated_at) {
      throw new Error("Нет данных stats.json");
    }

    document.getElementById("subs").textContent = format(stats.total_subscribers);
    document.getElementById("views").textContent = format(stats.total_views);
    document.getElementById("videos").textContent = format(stats.total_videos);

    document.getElementById("updated").textContent =
      "Обновлено: " + new Date(stats.updated_at).toLocaleString("ru-RU");

    // если история пустая — не ломаем сайт
    if (!Array.isArray(history) || history.length === 0) {
      console.log("История пока пустая");
      return;
    }

    const labels = history.map(x =>
      new Date(x.updated_at).toLocaleTimeString("ru-RU")
    );

    const data = history.map(x => x.total_subscribers || 0);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Подписчики",
          data,
          tension: 0.25
        }]
      }
    });

  } catch (e) {
    document.getElementById("updated").textContent =
      "Ошибка: " + e.message;
    console.error(e);
  }
}

load();
setInterval(load, 60000);
</script>
